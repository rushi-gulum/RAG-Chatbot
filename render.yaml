services:
  - type: web
    name: vw-brain-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # ── Runtime ──────────────────────────────────────────────────────────────
      # Python version is pinned via backend/.python-version file (3.11.9).
      # The PYTHON_VERSION env var below is kept for visibility but the file
      # takes precedence for Render's runtime selection.
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_ENV
        value: production

      # ── Auth ─────────────────────────────────────────────────────────────────
      - key: AUTH_DISABLED
        value: "false"
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false

      # ── PostgreSQL (Neon) ─────────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false

      # ── Groq LLM ─────────────────────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b

      # ── Cloudflare Workers AI ─────────────────────────────────────────────────
      - key: EMBEDDING_PROVIDER
        value: cloudflare
      - key: EMBEDDING_MODEL
        value: "@cf/baai/bge-small-en-v1.5"
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: EMBEDDING_BATCH_SIZE
        value: "32"
      - key: EMBEDDING_TIMEOUT_SECONDS
        value: "60"

      # ── Qdrant Cloud ──────────────────────────────────────────────────────────
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: rag_documents

      # ── CORS ─────────────────────────────────────────────────────────────────
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

      # ── Security ─────────────────────────────────────────────────────────────
      - key: SECRET_KEY
        sync: false
